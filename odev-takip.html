<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ödev Takip</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f4f6fb;--surface:#fff;--surface2:#eef1f8;--border:#e0e5f0;
  --text:#1a1d2e;--text2:#5a6380;--accent:#4f7ef8;--accent-soft:#e8f0ff;
  --danger:#e05252;--success:#2db56a;--warn:#f5a623;--purple:#9b59b6;
  --shadow:0 2px 14px rgba(60,80,160,.08);--radius:14px;--rsm:9px;
}
[data-theme="dark"]{
  --bg:#12141e;--surface:#1c1f30;--surface2:#252840;--border:#2e3355;
  --text:#e8eaf6;--text2:#8090b8;--accent:#6c9bff;--accent-soft:#1a2550;
  --shadow:0 2px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;font-size:15px}
a{color:inherit;text-decoration:none}

/* AUTH */
#authScreen{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:40px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.auth-title{font-size:1.6rem;font-weight:800;color:var(--accent);text-align:center;margin-bottom:4px}
.auth-sub{text-align:center;color:var(--text2);font-size:.88rem;margin-bottom:28px}
.auth-tabs{display:flex;gap:4px;background:var(--surface2);border-radius:9px;padding:4px;margin-bottom:20px}
.auth-tab{flex:1;padding:8px;border:none;border-radius:7px;cursor:pointer;font-size:.85rem;font-weight:600;font-family:inherit;background:none;color:var(--text2);transition:all .2s}
.auth-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.auth-msg{border-radius:8px;padding:10px 14px;font-size:.84rem;margin-bottom:14px;display:none}
.auth-msg.show{display:block}
.auth-msg.err{background:rgba(224,82,82,.08);border:1px solid rgba(224,82,82,.2);color:var(--danger)}
.auth-msg.ok{background:rgba(45,181,106,.08);border:1px solid rgba(45,181,106,.2);color:var(--success)}

/* LAYOUT */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;height:58px;gap:14px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.logo{font-size:1.1rem;font-weight:800;color:var(--accent);flex:1;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:2px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.nav-btn{padding:12px 16px;border:none;background:none;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--text2);border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap;font-family:inherit}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.nav-btn:hover{color:var(--text)}
main{max-width:1100px;margin:0 auto;padding:24px 16px 80px}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stat-label{font-size:.72rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
.stat-val{font-size:2rem;font-weight:800;color:var(--text);line-height:1}
.stat-val.accent{color:var(--accent)}
.stat-val.success{color:var(--success)}
.stat-val.danger{color:var(--danger)}
.stat-val.warn{color:var(--warn)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:var(--rsm);border:none;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.88}
.btn-secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:rgba(224,82,82,.1);border:1px solid rgba(224,82,82,.2);color:var(--danger)}
.btn-danger:hover{background:rgba(224,82,82,.18)}
.btn-sm{padding:5px 12px;font-size:.8rem;border-radius:7px}
.btn-icon{background:none;border:none;cursor:pointer;padding:6px 8px;border-radius:8px;font-size:14px;color:var(--text2);transition:all .2s}
.btn-icon:hover{background:var(--surface2);color:var(--text)}

/* FORM */
.field{margin-bottom:14px}
.field-label{display:block;font-size:.8rem;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.inp{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--rsm);font-size:.9rem;background:var(--bg);color:var(--text);font-family:inherit;transition:border-color .2s}
.inp:focus{outline:none;border-color:var(--accent)}
select.inp{cursor:pointer}
textarea.inp{resize:vertical;min-height:80px}

/* SECTION HEADER */
.sec-hd{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sec-title{font-size:1.1rem;font-weight:800;flex:1}
.badge{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:700}

/* CLASS CARDS */
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.class-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.class-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--cc,var(--accent))}
.class-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(60,80,160,.13)}
.class-card-name{font-size:1.05rem;font-weight:800;margin-bottom:4px}
.class-card-desc{font-size:.82rem;color:var(--text2);margin-bottom:14px;min-height:20px}
.class-card-stats{display:flex;gap:12px}
.cs-stat{text-align:center}
.cs-num{font-size:1.2rem;font-weight:800;color:var(--accent)}
.cs-lbl{font-size:.7rem;color:var(--text2);font-weight:600}
.class-card-actions{position:absolute;top:12px;right:12px;display:flex;gap:4px;opacity:0;transition:opacity .2s}
.class-card:hover .class-card-actions{opacity:1}

/* ASSIGNMENT LIST */
.assign-list{display:flex;flex-direction:column;gap:10px}
.assign-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);transition:all .2s}
.assign-item:hover{border-color:var(--accent)}
.assign-type-badge{padding:4px 10px;border-radius:99px;font-size:.72rem;font-weight:700;white-space:nowrap}
.type-odev{background:rgba(79,126,248,.12);color:var(--accent)}
.type-proje{background:rgba(155,89,182,.12);color:var(--purple)}
.type-quiz{background:rgba(245,166,35,.12);color:var(--warn)}
.type-arastirma{background:rgba(45,181,106,.12);color:var(--success)}
.assign-title{font-weight:700;flex:1}
.assign-meta{font-size:.8rem;color:var(--text2)}
.assign-progress{display:flex;align-items:center;gap:8px;min-width:120px}
.progress-bar{height:6px;border-radius:99px;background:var(--surface2);flex:1;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;background:var(--success);transition:width .3s}
.due-chip{font-size:.75rem;padding:3px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.due-ok{background:rgba(45,181,106,.1);color:var(--success)}
.due-soon{background:rgba(245,166,35,.1);color:var(--warn)}
.due-late{background:rgba(224,82,82,.1);color:var(--danger)}
.due-none{background:var(--surface2);color:var(--text2)}

/* SUBMISSIONS TABLE */
.sub-table{width:100%;border-collapse:collapse}
.sub-table th{padding:10px 12px;text-align:left;font-size:.72rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1.2px;background:var(--surface2);border-bottom:1px solid var(--border)}
.sub-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:.88rem}
.sub-table tr:hover td{background:var(--surface2)}
.status-btn{border:none;border-radius:99px;padding:4px 12px;font-size:.75rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.s-bekliyor{background:var(--surface2);color:var(--text2)}
.s-teslim{background:rgba(45,181,106,.12);color:var(--success)}
.s-gec{background:rgba(245,166,35,.12);color:var(--warn)}
.s-eksik{background:rgba(224,82,82,.12);color:var(--danger)}
.grade-inp{width:64px;padding:5px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:.88rem;background:var(--bg);color:var(--text);font-family:inherit;text-align:center}
.grade-inp:focus{outline:none;border-color:var(--accent)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);padding:28px;max-width:500px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-size:1.05rem;font-weight:800}
.modal-close{background:none;border:none;cursor:pointer;font-size:1.3rem;color:var(--text2);padding:4px 8px;border-radius:6px;transition:all .2s}
.modal-close:hover{background:var(--surface2)}
.row-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* USER CHIP */
.user-chip{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:3px 10px 3px 8px;font-size:.78rem;color:var(--text2)}
.user-chip .email{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-chip button{background:none;border:none;cursor:pointer;color:var(--danger);font-size:.75rem;font-weight:700;padding:2px 6px;border-radius:5px}
.user-chip button:hover{background:rgba(224,82,82,.1)}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:var(--surface);padding:11px 20px;border-radius:var(--rsm);font-size:.88rem;font-weight:600;z-index:999;opacity:0;transform:translateY(12px);transition:all .28s;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}

/* THEME BTN */
.theme-btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rsm);padding:6px 12px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--text2);font-family:inherit;transition:all .2s}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ANNOUNCEMENT */
.ann-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:10px}
.ann-title{font-weight:700;margin-bottom:4px}
.ann-content{font-size:.88rem;color:var(--text2);margin-bottom:8px}
.ann-meta{font-size:.75rem;color:var(--text2)}

/* BACK BTN */
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--text2);padding:6px 0;margin-bottom:16px;font-family:inherit;transition:color .2s}
.back-btn:hover{color:var(--accent)}

/* STUDENT REPORT */
.report-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.report-row:last-child{border-bottom:none}

/* WHATSAPP BOX */
.wa-box{background:rgba(37,211,102,.06);border:1px solid rgba(37,211,102,.2);border-radius:var(--rsm);padding:14px;margin-top:12px;font-size:.85rem;line-height:1.7;color:var(--text)}
.wa-copy-btn{background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.25);color:#1a7a3a;border-radius:var(--rsm);padding:6px 14px;font-size:.82rem;font-weight:700;cursor:pointer;margin-top:8px;font-family:inherit}

/* EMPTY STATE */
.empty{text-align:center;padding:48px 20px;color:var(--text2)}
.empty-icon{font-size:3rem;margin-bottom:12px}
.empty p{font-size:.9rem}

/* LOADING */
.loading{text-align:center;padding:60px;color:var(--text2);font-size:.95rem}

/* COLOR DOTS */
.color-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .15s}
.color-dot.selected{border-color:var(--text);transform:scale(1.15)}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page{animation:fadeIn .25s ease}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-title">📚 Ödev Takip</div>
    <p class="auth-sub">Hesabınıza giriş yapın</p>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="authTab('login')">Giriş Yap</button>
      <button class="auth-tab" onclick="authTab('signup')">Kayıt Ol</button>
    </div>
    <div id="authMsg" class="auth-msg"></div>
    <div class="field">
      <label class="field-label">E-posta</label>
      <input class="inp" id="authEmail" type="email" placeholder="ornek@mail.com" autocomplete="email" onkeydown="if(event.key==='Enter')doAuth()"/>
    </div>
    <div class="field">
      <label class="field-label">Şifre</label>
      <input class="inp" id="authPass" type="password" placeholder="En az 6 karakter" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAuth()"/>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px" id="authBtn" onclick="doAuth()">Giriş Yap</button>
  </div>
</div>

<div id="app" style="display:none">
<header>
  <div class="logo"><div class="logo-dot"></div>Ödev<span style="color:var(--text)">Takip</span></div>
  <div id="userChip" class="user-chip">
    <span>👤</span><span class="email" id="userEmail"></span>
    <button onclick="signOut()">Çıkış</button>
  </div>
  <button class="theme-btn" onclick="toggleTheme()">🌙 Tema</button>
</header>
<nav id="nav">
  <button class="nav-btn active" data-page="dashboard" onclick="goto('dashboard')">🏠 Özet</button>
  <button class="nav-btn" data-page="classes" onclick="goto('classes')">📚 Sınıflar</button>
  <button class="nav-btn" data-page="assignments" onclick="goto('assignments')">📝 Ödevler</button>
  <button class="nav-btn" data-page="announcements" onclick="goto('announcements')">📢 Duyurular</button>
</nav>
<main id="main"><div class="loading">Yükleniyor…</div></main>
</div>

<!-- Class Modal -->
<div class="overlay" id="mo-class">
  <div class="modal">
    <div class="modal-hd"><span class="modal-title" id="mo-class-title">Sınıf Ekle</span><button class="modal-close" onclick="closeModal('mo-class')">×</button></div>
    <div class="field"><label class="field-label">Sınıf Adı</label><input class="inp" id="cl-name" placeholder="Örn: 9-A Kimya"/></div>
    <div class="field"><label class="field-label">Açıklama (opsiyonel)</label><input class="inp" id="cl-desc" placeholder="Örn: 2025-2026 Güz Dönemi"/></div>
    <div class="field"><label class="field-label">Renk</label>
      <div class="color-row" id="colorRow"></div>
    </div>
    <div class="row-btns">
      <button class="btn btn-secondary" onclick="closeModal('mo-class')">İptal</button>
      <button class="btn btn-primary" onclick="saveClass()">Kaydet</button>
    </div>
  </div>
</div>

<!-- Student Modal -->
<div class="overlay" id="mo-student">
  <div class="modal">
    <div class="modal-hd"><span class="modal-title" id="mo-student-title">Öğrenci Ekle</span><button class="modal-close" onclick="closeModal('mo-student')">×</button></div>
    <div class="field"><label class="field-label">Ad Soyad</label><input class="inp" id="st-name" placeholder="Öğrenci adı"/></div>
    <div class="field"><label class="field-label">Okul Numarası (opsiyonel)</label><input class="inp" id="st-num" type="number" placeholder="Örn: 1234"/></div>
    <div class="row-btns">
      <button class="btn btn-secondary" onclick="closeModal('mo-student')">İptal</button>
      <button class="btn btn-primary" onclick="saveStudent()">Kaydet</button>
    </div>
  </div>
</div>

<!-- Assignment Modal -->
<div class="overlay" id="mo-assign">
  <div class="modal">
    <div class="modal-hd"><span class="modal-title" id="mo-assign-title">Ödev Ekle</span><button class="modal-close" onclick="closeModal('mo-assign')">×</button></div>
    <div class="field"><label class="field-label">Başlık</label><input class="inp" id="as-title" placeholder="Ödev başlığı"/></div>
    <div class="field"><label class="field-label">Açıklama</label><textarea class="inp" id="as-desc" placeholder="Ödev detayları, linkler..."></textarea></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="field"><label class="field-label">Tür</label>
        <select class="inp" id="as-type">
          <option value="odev">📖 Ödev</option>
          <option value="proje">🔬 Proje</option>
          <option value="quiz">✏️ Quiz</option>
          <option value="arastirma">🔍 Araştırma</option>
        </select>
      </div>
      <div class="field"><label class="field-label">Teslim Tarihi</label><input class="inp" id="as-due" type="date"/></div>
    </div>
    <div class="field"><label class="field-label">Puan (opsiyonel)</label><input class="inp" id="as-pts" type="number" min="0" max="200" placeholder="100"/></div>
    <div class="row-btns">
      <button class="btn btn-secondary" onclick="closeModal('mo-assign')">İptal</button>
      <button class="btn btn-primary" onclick="saveAssignment()">Kaydet</button>
    </div>
  </div>
</div>

<!-- Announcement Modal -->
<div class="overlay" id="mo-ann">
  <div class="modal">
    <div class="modal-hd"><span class="modal-title">Duyuru Ekle</span><button class="modal-close" onclick="closeModal('mo-ann')">×</button></div>
    <div class="field"><label class="field-label">Sınıf</label>
      <select class="inp" id="ann-class"></select>
    </div>
    <div class="field"><label class="field-label">Başlık</label><input class="inp" id="ann-title" placeholder="Duyuru başlığı"/></div>
    <div class="field"><label class="field-label">İçerik</label><textarea class="inp" id="ann-content" placeholder="Duyuru detayları..."></textarea></div>
    <div class="row-btns">
      <button class="btn btn-secondary" onclick="closeModal('mo-ann')">İptal</button>
      <button class="btn btn-primary" onclick="saveAnnouncement()">Yayınla</button>
    </div>
  </div>
</div>

<!-- WhatsApp Modal -->
<div class="overlay" id="mo-wa">
  <div class="modal">
    <div class="modal-hd"><span class="modal-title">💬 Veli Bildirimi</span><button class="modal-close" onclick="closeModal('mo-wa')">×</button></div>
    <p style="font-size:.85rem;color:var(--text2);margin-bottom:12px">Ödevini teslim etmeyen öğrenciler için veli bildirim metni:</p>
    <div class="wa-box" id="waText"></div>
    <button class="wa-copy-btn" onclick="copyWa()">📋 Kopyala</button>
    <p style="font-size:.75rem;color:var(--text2);margin-top:10px">WhatsApp'a yapıştırıp gönderebilirsiniz.</p>
  </div>
</div>

<div id="toast"></div>

<script>
const SB_URL='https://yqyrhuednyhirgcghexe.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlxeXJodWVkbnloaXJnY2doZXhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NzQ5MTgsImV4cCI6MjA5NTM1MDkxOH0.bPaF2xWNL4k4eZhhQpzYpaCojqSVIYe4sqM-atpoDJM';
const sb=supabase.createClient(SB_URL,SB_KEY);

const COLORS=['#4f7ef8','#9b59b6','#2db56a','#f5a623','#e05252','#1abc9c','#e67e22','#2980b9'];
const TYPE_LABELS={odev:'📖 Ödev',proje:'🔬 Proje',quiz:'✏️ Quiz',arastirma:'🔍 Araştırma'};
const STATUS_LABELS={bekliyor:'⏳ Bekliyor',teslim:'✅ Teslim',gec:'⚠️ Geç',eksik:'❌ Eksik'};
const STATUS_CYCLE={bekliyor:'teslim',teslim:'gec',gec:'eksik',eksik:'bekliyor'};

let page='dashboard';
let classes=[],students=[],assignments=[],submissions=[],announcements=[];
let activeClassId=null,activeAssignId=null;
let editClassId=null,editStudentId=null,editAssignId=null;
let selectedColor=COLORS[0];

// ── AUTH
let authMode='login';
function authTab(mode){
  authMode=mode;
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',mode==='login'?i===0:i===1));
  document.getElementById('authBtn').textContent=mode==='login'?'Giriş Yap':'Kayıt Ol';
  setAuthMsg('','');
}
function setAuthMsg(msg,type){
  const e=document.getElementById('authMsg');
  e.textContent=msg;e.className='auth-msg'+(msg?' show':'')+(type?' '+type:'');
}
async function doAuth(){
  const email=document.getElementById('authEmail')?.value.trim();
  const pass=document.getElementById('authPass')?.value;
  if(!email||!pass){setAuthMsg('E-posta ve şifre gerekli','err');return;}
  const btn=document.getElementById('authBtn');
  btn.textContent='...';btn.disabled=true;
  const res=authMode==='login'
    ?await sb.auth.signInWithPassword({email,password:pass})
    :await sb.auth.signUp({email,password:pass});
  btn.disabled=false;btn.textContent=authMode==='login'?'Giriş Yap':'Kayıt Ol';
  if(res.error){setAuthMsg(res.error.message,'err');return;}
  if(authMode==='signup'&&res.data?.user&&!res.data?.session){
    setAuthMsg('✓ Kayıt başarılı! E-postanızı onaylayın, ardından giriş yapın.','ok');return;
  }
  showApp(res.data.user);await loadAll();
}
function showApp(user){
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('userEmail').textContent=user.email;
}
async function signOut(){await sb.auth.signOut();location.reload();}

// ── THEME
(function(){const t=localStorage.getItem('ot_theme')||'light';document.documentElement.setAttribute('data-theme',t)})();
function toggleTheme(){
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  localStorage.setItem('ot_theme',dark?'light':'dark');
}

// ── UTILS
function toast(msg,err){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='show'+(err?' danger':'');
  setTimeout(()=>el.className='',2500);
}
function esc(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML;}
function fmtDate(s){if(!s)return'';const[y,m,d]=s.split('-');return d+'.'+m+'.'+y;}
function dueStatus(due){
  if(!due)return'none';
  const today=new Date();today.setHours(0,0,0,0);
  const d=new Date(due);
  const diff=Math.ceil((d-today)/(1000*60*60*24));
  if(diff<0)return'late';
  if(diff<=3)return'soon';
  return'ok';
}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeModal(o.id);}));

// ── NAVIGATION
function goto(p){
  page=p;activeAssignId=null;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
  render();
}

// ── DATA LOAD
async function loadAll(){
  const[c,s,a,sub,ann]=await Promise.all([
    sb.from('hw_classes').select('*').order('created_at'),
    sb.from('hw_students').select('*').order('name'),
    sb.from('hw_assignments').select('*').order('created_at',{ascending:false}),
    sb.from('hw_submissions').select('*'),
    sb.from('hw_announcements').select('*').order('created_at',{ascending:false})
  ]);
  classes=c.data||[];students=s.data||[];assignments=a.data||[];
  submissions=sub.data||[];announcements=ann.data||[];
  render();
}

// ── RENDER ROUTER
function render(){
  const m=document.getElementById('main');
  if(activeAssignId){m.innerHTML=renderSubmissions();return;}
  if(page==='dashboard')m.innerHTML=renderDashboard();
  else if(page==='classes')m.innerHTML=activeClassId?renderClassDetail():renderClasses();
  else if(page==='assignments')m.innerHTML=renderAssignments();
  else if(page==='announcements')m.innerHTML=renderAnnouncements();
}

// ── DASHBOARD
function renderDashboard(){
  const today=new Date();today.setHours(0,0,0,0);
  const upcoming=assignments.filter(a=>a.due_date&&new Date(a.due_date)>=today).sort((a,b)=>new Date(a.due_date)-new Date(b.due_date)).slice(0,5);
  const totalSubs=submissions.length;
  const doneSubs=submissions.filter(s=>s.status==='teslim'||s.status==='gec').length;
  const missSubs=submissions.filter(s=>s.status==='eksik').length;
  const rate=totalSubs?Math.round(doneSubs/totalSubs*100):0;

  let html=`<div class="page">
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-label">Sınıflar</div><div class="stat-val accent">${classes.length}</div></div>
    <div class="stat-card"><div class="stat-label">Toplam Ödev</div><div class="stat-val">${assignments.length}</div></div>
    <div class="stat-card"><div class="stat-label">Teslim Oranı</div><div class="stat-val success">${rate}%</div></div>
    <div class="stat-card"><div class="stat-label">Eksik Teslim</div><div class="stat-val danger">${missSubs}</div></div>
  </div>`;

  if(upcoming.length){
    html+=`<div class="card" style="margin-bottom:20px"><div class="sec-hd"><span class="sec-title">📅 Yaklaşan Teslimler</span></div><div class="assign-list">`;
    upcoming.forEach(a=>{
      const cls=classes.find(c=>c.id===a.class_id);
      const st=dueStatus(a.due_date);
      html+=`<div class="assign-item" onclick="openAssignDetail('${a.id}')">
        <span class="assign-type-badge type-${a.type}">${TYPE_LABELS[a.type]||a.type}</span>
        <div style="flex:1"><div class="assign-title">${esc(a.title)}</div>
        <div class="assign-meta">${cls?esc(cls.name):''}</div></div>
        <span class="due-chip due-${st}">${fmtDate(a.due_date)}</span>
      </div>`;
    });
    html+=`</div></div>`;
  }

  // Recent announcements
  const recAnn=announcements.slice(0,3);
  if(recAnn.length){
    html+=`<div class="card"><div class="sec-hd"><span class="sec-title">📢 Son Duyurular</span></div>`;
    recAnn.forEach(a=>{
      const cls=classes.find(c=>c.id===a.class_id);
      html+=`<div class="ann-item"><div class="ann-title">${esc(a.title)}</div>
        <div class="ann-content">${esc(a.content||'')}</div>
        <div class="ann-meta">${cls?esc(cls.name):''} · ${fmtDate(a.created_at?.split('T')[0])}</div></div>`;
    });
    html+=`</div>`;
  }

  if(!classes.length){
    html+=`<div class="empty"><div class="empty-icon">📚</div><p>Henüz sınıf yok.<br>Sınıflar sekmesinden başlayın.</p></div>`;
  }
  return html+'</div>';
}

// ── ASSIGNMENTS PAGE
function renderAssignments(){
  let html=`<div class="page"><div class="sec-hd"><span class="sec-title">📝 Tüm Ödevler <span class="badge">${assignments.length}</span></span>
    <button class="btn btn-primary" onclick="openAssignModal(null)">+ Ödev Ekle</button></div>`;

  }else{
    // Group by class
    classes.forEach(cls=>{
      const clsAssigns=assignments.filter(a=>a.class_id===cls.id);
      if(!clsAssigns.length)return;
      html+=`<div style="margin-bottom:24px"><div style="font-size:.85rem;font-weight:700;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:8px">
        <span style="width:10px;height:10px;border-radius:50%;background:${cls.color||COLORS[0]};display:inline-block"></span>
        ${esc(cls.name)}</div><div class="assign-list">`;
      clsAssigns.forEach(a=>{
        const studs=students.filter(s=>s.class_id===cls.id).length;
        const done=submissions.filter(s=>s.assignment_id===a.id&&(s.status==='teslim'||s.status==='gec')).length;
        const pct=studs?Math.round(done/studs*100):0;
        const st=dueStatus(a.due_date);
        html+=`<div class="assign-item">
          <span class="assign-type-badge type-${a.type}">${TYPE_LABELS[a.type]||a.type}</span>
          <div style="flex:1;cursor:pointer" onclick="openAssignDetail('${a.id}')">
            <div class="assign-title">${esc(a.title)}</div>
            ${a.description?`<div class="assign-meta">${esc(a.description.slice(0,60))}${a.description.length>60?'…':''}</div>`:''}
          </div>
          <div class="assign-progress">
            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
            <span style="font-size:.75rem;color:var(--text2);min-width:36px">${done}/${studs}</span>
          </div>
          <span class="due-chip due-${st}">${a.due_date?fmtDate(a.due_date):'Tarih yok'}</span>
          <button class="btn-icon" onclick="deleteAssignment('${a.id}')">🗑</button>
        </div>`;
      });
      html+=`</div></div>`;
    });
  }
  return html+'</div>';
}

function openAssignDetail(id){activeAssignId=id;render();}

  const missing=submissions.filter(s=>s.assignment_id===activeAssignId&&s.status==='eksik').length;

  let html=`<div class="page">
    <button class="back-btn" onclick="activeAssignId=null;render()">← Geri Dön</button>
    <div class="card" style="margin-bottom:20px">
      <div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap">

          <span class="assign-type-badge type-${assign.type}" style="margin-bottom:8px;display:inline-block">${TYPE_LABELS[assign.type]||assign.type}</span>

          ${assign.description?`<div style="font-size:.88rem;color:var(--text2);margin-bottom:8px">${esc(assign.description)}</div>`:''}
          <div style="display:flex;gap:12px;flex-wrap:wrap">
            ${cls?`<span style="font-size:.82rem;color:var(--text2)">📚 ${esc(cls.name)}</span>`:''}
            ${assign.due_date?`<span class="due-chip due-${dueStatus(assign.due_date)}">📅 ${fmtDate(assign.due_date)}</span>`:''}

          </div>
        </div>
        <div style="text-align:center;min-width:80px">
          <div style="font-size:2rem;font-weight:800;color:${pct>=70?'var(--success)':pct>=40?'var(--warn)':'var(--danger)'}">${pct}%</div>

  studs.forEach((st,i)=>{

    html+=`<tr>
      <td style="color:var(--text2);font-size:.8rem">${st.number||i+1}</td>
      <td style="font-weight:600">${esc(st.name)}</td>

// ── CLASS CRUD
function openClassModal(){
  editClassId=null;selectedColor=COLORS[0];
  document.getElementById('mo-class-title').textContent='Sınıf Ekle';
  document.getElementById('cl-name').value='';
  document.getElementById('cl-desc').value='';
  renderColorRow();openModal('mo-class');
  setTimeout(()=>document.getElementById('cl-name').focus(),100);
}
function openEditClass(id){
  const cls=classes.find(c=>c.id===id);if(!cls)return;
  editClassId=id;selectedColor=cls.color||COLORS[0];
  document.getElementById('mo-class-title').textContent='Sınıf Düzenle';
  document.getElementById('cl-name').value=cls.name;
  document.getElementById('cl-desc').value=cls.description||'';
  renderColorRow();openModal('mo-class');
}
function renderColorRow(){
  const row=document.getElementById('colorRow');
  row.innerHTML=COLORS.map(c=>`<div class="color-dot${c===selectedColor?' selected':''}" style="background:${c}" onclick="selectedColor='${c}';renderColorRow()"></div>`).join('');
}
async function saveClass(){
  const name=document.getElementById('cl-name').value.trim();
  const desc=document.getElementById('cl-desc').value.trim();
  if(!name){toast('Sınıf adı gerekli',true);return;}
  const data={name,description:desc,color:selectedColor};
  const res=editClassId
    ?await sb.from('hw_classes').update(data).eq('id',editClassId)
    :await sb.from('hw_classes').insert(data).select().single();
  if(res.error){toast('Hata: '+res.error.message,true);return;}
  closeModal('mo-class');await loadAll();toast(editClassId?'✓ Güncellendi':'✓ Sınıf eklendi');
}
async function deleteClass(id){
  const cls=classes.find(c=>c.id===id);
  if(!confirm(`"${cls?.name}" sınıfı ve tüm öğrencileri/ödevleri silinsin mi?`))return;
  await sb.from('hw_classes').delete().eq('id',id);
  if(activeClassId===id)activeClassId=null;
  await loadAll();toast('Sınıf silindi');
}

// ── STUDENT CRUD
function openStudentModal(){
  editStudentId=null;
  document.getElementById('mo-student-title').textContent='Öğrenci Ekle';
  document.getElementById('st-name').value='';
  document.getElementById('st-num').value='';
  openModal('mo-student');
  setTimeout(()=>document.getElementById('st-name').focus(),100);
}
async function saveStudent(){
  const name=document.getElementById('st-name').value.trim();
  const num=document.getElementById('st-num').value;
  if(!name){toast('Öğrenci adı gerekli',true);return;}
  const res=await sb.from('hw_students').insert({class_id:activeClassId,name,number:num?parseInt(num):null}).select().single();
  if(res.error){toast('Hata: '+res.error.message,true);return;}
  closeModal('mo-student');await loadAll();toast('✓ Öğrenci eklendi');
}
async function deleteStudent(id){
  if(!confirm('Bu öğrenciyi sil?'))return;
  await sb.from('hw_students').delete().eq('id',id);
  await loadAll();toast('Öğrenci silindi');
}

// ── ASSIGNMENT CRUD
let assignForClass=null;
function openAssignModal(classId){
  editAssignId=null;assignForClass=classId||activeClassId;
  document.getElementById('mo-assign-title').textContent='Ödev Ekle';
  document.getElementById('as-title').value='';
  document.getElementById('as-desc').value='';
  document.getElementById('as-type').value='odev';
  document.getElementById('as-due').value='';
  document.getElementById('as-pts').value='100';
  openModal('mo-assign');
  setTimeout(()=>document.getElementById('as-title').focus(),100);
}
async function saveAssignment(){
  const title=document.getElementById('as-title').value.trim();
  const desc=document.getElementById('as-desc').value.trim();
  const type=document.getElementById('as-type').value;
  const due=document.getElementById('as-due').value;
  const pts=document.getElementById('as-pts').value;
  if(!title){toast('Ödev başlığı gerekli',true);return;}
  if(!assignForClass){toast('Lütfen bir sınıf seçin',true);return;}
  const data={class_id:assignForClass,title,description:desc,type,due_date:due||null,points:pts?parseInt(pts):null};
  const res=await sb.from('hw_assignments').insert(data).select().single();
  if(res.error){toast('Hata: '+res.error.message,true);return;}
  // Create submission rows for all students in this class
  const studs=students.filter(s=>s.class_id===assignForClass);
  if(studs.length){
    await sb.from('hw_submissions').insert(studs.map(s=>({assignment_id:res.data.id,student_id:s.id,status:'bekliyor'})));
  }
  closeModal('mo-assign');await loadAll();toast('✓ Ödev eklendi');
}
async function deleteAssignment(id){
  if(!confirm('Bu ödevi sil?'))return;
  await sb.from('hw_assignments').delete().eq('id',id);
  if(activeAssignId===id)activeAssignId=null;
  await loadAll();toast('Ödev silindi');
}

// ── SUBMISSION OPS
async function cycleStatus(studentId,subId,currentStatus){
  const newStatus=STATUS_CYCLE[currentStatus]||'teslim';
  const now=new Date().toISOString();
  if(subId&&subId!==''){
    await sb.from('hw_submissions').update({status:newStatus,updated_at:now}).eq('id',subId);
  }else{
    await sb.from('hw_submissions').upsert({assignment_id:activeAssignId,student_id:studentId,status:newStatus,updated_at:now});
  }
  const idx=submissions.findIndex(s=>s.assignment_id===activeAssignId&&s.student_id===studentId);
  if(idx>=0)submissions[idx].status=newStatus;
  else submissions.push({id:'tmp',assignment_id:activeAssignId,student_id:studentId,status:newStatus});
  render();
}
async function saveGrade(studentId,subId,val){
  const grade=val===''?null:parseFloat(val);
  const now=new Date().toISOString();
  if(subId&&subId!==''){
    await sb.from('hw_submissions').update({grade,updated_at:now}).eq('id',subId);
  }else{
    const res=await sb.from('hw_submissions').upsert({assignment_id:activeAssignId,student_id:studentId,grade,status:'teslim',updated_at:now}).select().single();
    if(res.data){const idx=submissions.findIndex(s=>s.assignment_id===activeAssignId&&s.student_id===studentId);if(idx>=0)submissions[idx]=res.data;else submissions.push(res.data);}
  }
  toast('✓ Kaydedildi');
}
async function saveNote(studentId,subId,note){
  const now=new Date().toISOString();
  if(subId&&subId!==''){
    await sb.from('hw_submissions').update({note,updated_at:now}).eq('id',subId);
  }else{
    await sb.from('hw_submissions').upsert({assignment_id:activeAssignId,student_id:studentId,note,status:'bekliyor',updated_at:now});
  }
}
async function markAll(status){
  const assign=assignments.find(a=>a.id===activeAssignId);if(!assign)return;
  const studs=students.filter(s=>s.class_id===assign.class_id);
  const now=new Date().toISOString();
  await Promise.all(studs.map(s=>{
    const sub=submissions.find(x=>x.assignment_id===activeAssignId&&x.student_id===s.id);
    return sub
      ?sb.from('hw_submissions').update({status,updated_at:now}).eq('id',sub.id)
      :sb.from('hw_submissions').upsert({assignment_id:activeAssignId,student_id:s.id,status,updated_at:now});
  }));
  await loadAll();toast(`✓ Tüm öğrenciler: ${STATUS_LABELS[status]}`);
}

// ── WHATSAPP
function showWa(){
  const assign=assignments.find(a=>a.id===activeAssignId);if(!assign)return;
  const cls=classes.find(c=>c.id===assign.class_id);
  const missStudents=students.filter(s=>{
    const sub=submissions.find(x=>x.assignment_id===activeAssignId&&x.student_id===s.id);
    return !sub||sub.status==='eksik';
  });
  if(!missStudents.length){toast('Eksik öğrenci yok!');return;}
  const names=missStudents.map(s=>s.name).join(', ');
  const msg=`Sayın velimiz,\n\n"${assign.title}" başlıklı ödev${assign.due_date?' ('+fmtDate(assign.due_date)+' tarihine kadar)':''} teslim edilmemiştir.\n\nİlgili öğrenciler: ${names}\n\nÖğrencinizin ödevi tamamlaması için lütfen destek olunuz.\n\nSaygılarımla,\n${cls?cls.name+' Öğretmeni':'Öğretmeniniz'}`;
  document.getElementById('waText').textContent=msg;
  openModal('mo-wa');
}
function copyWa(){
  const txt=document.getElementById('waText').textContent;
  navigator.clipboard.writeText(txt).then(()=>toast('✓ Kopyalandı')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('✓ Kopyalandı');
  });
}

// ── ANNOUNCEMENTS CRUD
function openAnnModal(){
  const sel=document.getElementById('ann-class');
  sel.innerHTML=classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  document.getElementById('ann-title').value='';
  document.getElementById('ann-content').value='';
  openModal('mo-ann');
  setTimeout(()=>document.getElementById('ann-title').focus(),100);
}
async function saveAnnouncement(){
  const class_id=document.getElementById('ann-class').value;
  const title=document.getElementById('ann-title').value.trim();
  const content=document.getElementById('ann-content').value.trim();
  if(!title){toast('Başlık gerekli',true);return;}
  const res=await sb.from('hw_announcements').insert({class_id,title,content}).select().single();
  if(res.error){toast('Hata: '+res.error.message,true);return;}
  closeModal('mo-ann');await loadAll();toast('✓ Duyuru yayınlandı');
}
async function deleteAnn(id){
  if(!confirm('Duyuruyu sil?'))return;
  await sb.from('hw_announcements').delete().eq('id',id);
  await loadAll();toast('Duyuru silindi');
}

// ── INIT
(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(session){showApp(session.user);await loadAll();}
  sb.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_OUT')location.reload();
  });
})();
</script>
