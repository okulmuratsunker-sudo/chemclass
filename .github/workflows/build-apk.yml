name: Build APK

on:
  push:
    branches:
      - claude/chemclass-apps-rebuild-sn8tjk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/chemclass_flutter
        run: flutter pub get

      - name: Build teacher APK
        working-directory: apps/chemclass_flutter
        run: flutter build apk --debug --flavor teacher -t lib/main.dart

      - name: Build student APK
        working-directory: apps/chemclass_flutter
        run: flutter build apk --debug --flavor student -t lib/main_student.dart

      - name: Create release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ChemClass APK build ${{ github.run_number }}
          files: |
            apps/chemclass_flutter/build/app/outputs/flutter-apk/app-teacher-debug.apk
            apps/chemclass_flutter/build/app/outputs/flutter-apk/app-student-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
