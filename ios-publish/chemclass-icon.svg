<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f6e"/>
      <stop offset="100%" stop-color="#2d3baa"/>
    </linearGradient>
    <linearGradient id="nucleus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4ff"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)" rx="220"/>

  <!-- Subtle inner glow -->
  <circle cx="512" cy="480" r="380" fill="none" stroke="#4a5fd4" stroke-width="1" opacity="0.4"/>

  <!-- Orbital ring 1 (horizontal) -->
  <ellipse cx="512" cy="512" rx="310" ry="118"
    fill="none" stroke="#64b5f6" stroke-width="18" stroke-linecap="round" opacity="0.85"/>

  <!-- Orbital ring 2 (rotated 60°) -->
  <ellipse cx="512" cy="512" rx="310" ry="118"
    fill="none" stroke="#64b5f6" stroke-width="18" stroke-linecap="round" opacity="0.85"
    transform="rotate(60 512 512)"/>

  <!-- Orbital ring 3 (rotated 120°) -->
  <ellipse cx="512" cy="512" rx="310" ry="118"
    fill="none" stroke="#64b5f6" stroke-width="18" stroke-linecap="round" opacity="0.85"
    transform="rotate(120 512 512)"/>

  <!-- Electron 1 — rightmost of orbit 1 -->
  <circle cx="822" cy="512" r="28" fill="#fdd835" filter="url(#glow)"/>

  <!-- Electron 2 — rotated 60° -->
  <circle cx="822" cy="512" r="28" fill="#fdd835" filter="url(#glow)"
    transform="rotate(60 512 512)"/>

  <!-- Electron 3 — rotated 120° -->
  <circle cx="822" cy="512" r="28" fill="#fdd835" filter="url(#glow)"
    transform="rotate(120 512 512)"/>

  <!-- Nucleus outer glow -->
  <circle cx="512" cy="512" r="88" fill="#4a6fa5" opacity="0.35"/>

  <!-- Nucleus -->
  <circle cx="512" cy="512" r="72" fill="url(#nucleus)"/>

  <!-- Nucleus protons/neutrons pattern -->
  <circle cx="497" cy="497" r="18" fill="#1565c0" opacity="0.7"/>
  <circle cx="527" cy="497" r="18" fill="#e53935" opacity="0.7"/>
  <circle cx="512" cy="523" r="18" fill="#1565c0" opacity="0.7"/>

  <!-- "CC" text beneath atom -->
  <text x="512" y="870"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="110" font-weight="800"
    fill="white" text-anchor="middle" opacity="0.92"
    letter-spacing="-4">ChemClass</text>
</svg>
